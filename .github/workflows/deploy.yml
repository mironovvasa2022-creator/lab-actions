name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted                      # Критерий 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets   # Критерий 3
        run: |
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          # копия без значений секретов - её сохраняем как артефакт
          sed 's/=.*/=***/' .env > env.masked
          cat env.masked

      - name: Deploy with Docker Compose      # Критерий 2
        run: |
          docker compose down -v || true
          docker compose up -d --build
          echo "Waiting for services to start..."
          sleep 20
          docker compose ps

      - name: Verify containers are running   # Критерий 2
        run: |
          if [ "$(docker compose ps --status running -q | wc -l)" -ge 2 ]; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Run application tests           # Критерий 4
        run: |
          PORT=${{ secrets.APP_PORT }}

          echo "1. Testing application and database connectivity..."
          curl -f http://localhost:$PORT/health || exit 1
          echo
          curl -f -s http://localhost:$PORT/api/data || exit 1
          echo
          echo "App and DB are working"

          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} \
                     -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \r\n')
          WEB_COUNT=$(curl -s http://localhost:$PORT/api/items/count | tr -d ' \r\n')
          echo "Database count: $DB_COUNT"
          echo "Web API count:  $WEB_COUNT"
          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "Data consistency test passed"
          else
            echo "Data consistency test failed"
            exit 1
          fi

          cat > test-report.md << EOF
          # Deployment Test Report
          - Date: $(date)
          - Application: Healthy
          - Database: Connected
          - Database records: $DB_COUNT
          - Web API records: $WEB_COUNT
          - Result: PASSED
          EOF

